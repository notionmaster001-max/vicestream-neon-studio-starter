<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Webcam Frame | ViceStream Neon Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 640px;
      height: 400px;
      background: transparent;
      overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cam-frame {
      width: calc(100% - 24px);
      height: calc(100% - 24px);
      max-width: 1920px;
      max-height: 1080px;
      border: 3px solid transparent;
      border-image: linear-gradient(135deg, #ff2a85 0%, #9d00ff 50%, #00f0ff 100%) 1;
      box-shadow: 0 0 25px rgba(255, 42, 133, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.2);
      position: relative;
    }

    .corner-decor {
      position: absolute;
      width: 16px;
      height: 16px;
      border: 3px solid #00f0ff;
    }
    .top-left { top: -8px; left: -8px; border-right: none; border-bottom: none; }
    .top-right { top: -8px; right: -8px; border-left: none; border-bottom: none; }
    .bottom-left { bottom: -8px; left: -8px; border-right: none; border-top: none; }
    .bottom-right { bottom: -8px; right: -8px; border-left: none; border-top: none; }

    .tag-badge {
      position: absolute;
      bottom: -18px;
      right: 20px;
      background: #080811;
      border: 2px solid #00f0ff;
      padding: 4px 16px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="cam-frame">
    <div class="corner-decor top-left"></div>
    <div class="corner-decor top-right"></div>
    <div class="corner-decor bottom-left"></div>
    <div class="corner-decor bottom-right"></div>
    <div class="tag-badge">VICE LIVE</div>
  </div>
</body>
</html>
